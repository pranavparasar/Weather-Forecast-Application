<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>Weather Forecast</h1>
      <p>Search real-time conditions and upcoming forecasts</p>
    </header>

    <section class="search-section">
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="city-input" 
          placeholder="Enter city name (e.g., London, Tokyo)" 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="search-btn">Search</button>
      </form>
      <p id="error-message" class="error-message" aria-live="polite"></p>
    </section>

    <div id="loader" class="loader hidden" aria-label="Loading weather data"></div>

    <section id="weather-display" class="weather-display hidden">
      <div class="current-card">
        <div class="current-header">
          <div>
            <h2 id="city-name">--</h2>
            <p id="current-date">--</p>
          </div>
          <img id="current-icon" src="" alt="Weather condition icon" class="weather-icon">
        </div>

        <div class="current-temp-block">
          <span id="current-temp" class="temp-value">--</span>
          <span class="temp-unit">°C</span>
          <p id="current-desc" class="condition-text">--</p>
        </div>

        <div class="weather-details-grid">
          <div class="detail-item">
            <span class="detail-label">Feels Like</span>
            <span id="feels-like" class="detail-val">--</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-val">--</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind Speed</span>
            <span id="wind-speed" class="detail-val">--</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Pressure</span>
            <span id="pressure" class="detail-val">--</span>
          </div>
        </div>
      </div>

      <div class="forecast-section">
        <h3>5-Day Forecast</h3>
        <div id="forecast-cards" class="forecast-grid"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
